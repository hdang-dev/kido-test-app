spring:
  application:
    name: testapp
  # No fallbacks here: outside the dev profile, missing env vars fail startup instead of using public defaults.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway owns the schema (design.md D6)
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  session:
    timeout: 30m          # idle timeout (design.md §6)
    jdbc:
      initialize-schema: never  # Flyway V2 owns the session tables

server:
  port: 8080
  error:
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true      # SESSION (and XSRF-TOKEN) only over https; the dev profile turns it off for http://localhost

# Seeded on startup if no SUPER_ADMIN exists (design.md §5)
app:
  super-admin:
    email: ${APP_SUPER_ADMIN_EMAIL}
    password: ${APP_SUPER_ADMIN_PASSWORD}
