spring:
  application:
    name: testapp
  # Defaults match docker-compose.yml (dev only). Override via env vars elsewhere.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testapp}
    username: ${DB_USERNAME:testapp}
    password: ${DB_PASSWORD:testapp}
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway owns the schema (design.md D6)
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

# Seeded on startup if no SUPER_ADMIN exists (design.md §5). Demo defaults only — override via env vars.
app:
  super-admin:
    email: ${APP_SUPER_ADMIN_EMAIL:superadmin@kido.local}
    password: ${APP_SUPER_ADMIN_PASSWORD:SuperAdmin@123}
