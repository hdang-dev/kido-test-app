spring:
  application:
    name: testapp
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

server:
  port: 8080
  error:
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

# Seeded on startup by config/ (demo only — override via env vars in any real setup)
app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:Admin@123}
